databases:
  - name: tg-marketplace-db
    databaseName: tg_marketplace
    user: tg_marketplace
    plan: free

services:
  - type: web
    name: tg-account-marketplace-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: USE_WEBHOOK
        value: "true"
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_DROP_PENDING
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tg-marketplace-db
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SUPPORT_CONTACT
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: PLATFORM_COMMISSION_RATE
        value: "0"
      - key: HOURLY_RELEASE_RATE
        value: "5"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: skip
      - key: SKIP_PAYMENT_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
